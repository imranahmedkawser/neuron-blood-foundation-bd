<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuron Blood Foundation BD</title>
<style>
body{font-family:sans-serif;background:#f4f4f4;margin:0;padding:0;text-align:center}
header{background:#c00;color:#fff;padding:15px;font-size:22px;font-weight:bold}
.btn{background:#c00;color:#fff;border:none;padding:12px 20px;margin:10px;border-radius:8px;cursor:pointer;font-size:16px}
.panel{background:#fff;margin:20px auto;padding:20px;border-radius:10px;max-width:500px;box-shadow:0 0 10px #ccc;text-align:left}
input,select{width:95%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:5px}
</style>
</head>
<body>

<header>Neuron Blood Foundation BD</header>

<button class="btn" onclick="showReg()">Donate Blood</button>
<button class="btn" onclick="showMembers()">Find Donor</button>
<button class="btn" onclick="showAdmin()">Admin Panel</button>

<div id="regForm" class="panel" style="display:none;">
  <h2>Donor Registration</h2>
  <input type="text" id="name" placeholder="Full Name">
  <input type="tel" id="phone" placeholder="Phone Number">
  <input type="email" id="email" placeholder="Email Address">
  <select id="blood">
    <option value="">Select Blood Group</option>
    <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
    <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
  </select>
  <input type="number" id="age" placeholder="Age">
  <button class="btn" onclick="register()">Submit</button>
</div>

<div id="memberPanel" class="panel" style="display:none;">
  <h2>Approved Donors</h2>
  <div id="memberList">Loading...</div>
</div>

<div id="adminPanel" class="panel" style="display:none;">
  <h2>Admin Login</h2>
  <input type="password" id="adminPass" placeholder="Password">
  <button class="btn" onclick="adminLogin()">Login</button>
  <div id="adminContent" style="display:none;">
    <h3>Pending Approvals</h3>
    <div id="pendingList"></div>
  </div>
</div>

<script type="module">
// 1. Firebase Config
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDdV-UefFIjoPsGnJqPoJBGVPcB7Fb5300",
  authDomain: "neuron-blood-foundation-bd.firebaseapp.com",
  databaseURL: "https://neuron-blood-foundation-bd-default-rtdb.firebaseio.com",
  projectId: "neuron-blood-foundation-bd",
  storageBucket: "neuron-blood-foundation-bd.firebasestorage.app",
  messagingSenderId: "996355512162",
  appId: "1:996355512162:web:c57adedcd0fb4727da3e3b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 2. Panel Show Hide
function hideAll(){
  document.getElementById('regForm').style.display='none';
  document.getElementById('memberPanel').style.display='none';
  document.getElementById('adminPanel').style.display='none';
}
window.showReg = function(){ hideAll(); document.getElementById('regForm').style.display='block'; }
window.showMembers = function(){ hideAll(); document.getElementById('memberPanel').style.display='block'; loadMembers(); }
window.showAdmin = function(){ hideAll(); document.getElementById('adminPanel').style.display='block'; }

// 3. Register Function
window.register = function(){
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  if(name=="" || phone==""){ alert("Name + Phone Must"); return; }
  
  push(ref(db, 'members'), {
    name: name,
    phone: phone,
    email: document.getElementById('email').value,
    blood: document.getElementById('blood').value,
    age: document.getElementById('age').value,
    status: "Pending"
  });
  alert("Registration Successful! Admin Approval Pending");
  document.getElementById('regForm').reset();
}

// 4. Admin Panel
const ADMIN_PASSWORD = "neuron123";
window.adminLogin = function(){
  if(document.getElementById('adminPass').value == ADMIN_PASSWORD){
    document.getElementById('adminContent').style.display="block"; 
    loadPending();
  } else { alert("Wrong Password!") }
}

function loadPending(){
  onValue(ref(db, 'members'), (snapshot) => {
    pendingList.innerHTML = "";
    snapshot.forEach((childSnap) => {
      if(childSnap.val().status == "Pending"){
        pendingList.innerHTML += `<p style="border-bottom:1px solid #ccc;padding:5px;">${childSnap.val().name} - ${childSnap.val().phone} - ${childSnap.val().blood} <button class="btn" style="padding:5px 10px;font-size:12px;" onclick="approve('${childSnap.key}')">Approve</button></p>`
      }
    })
  })
}

window.approve = function(id){
  update(ref(db, 'members/' + id), {status: "Approved"});
  alert("Approved!");
}

// 5. Show Approved Members
function loadMembers(){
  onValue(ref(db, 'members'), (snapshot) => {
    memberList.innerHTML = "";
    snapshot.forEach((childSnap) => {
      if(childSnap.val().status == "Approved"){
        memberList.innerHTML += `<p><b>${childSnap.val().name}</b> - ${childSnap.val().blood} - ${childSnap.val().phone}</p>`
      }
    })
    if(memberList.innerHTML=="") memberList.innerHTML = "No Approved Donors Yet";
  })
}
</script>

</body>
</html>
